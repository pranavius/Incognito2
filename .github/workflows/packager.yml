name: Package and release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract current version changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="**$TAG**" '$0 == heading {found=1; print; next} found && /^\*\*/ {exit} found' CHANGELOG > CHANGELOG.tmp
          test -s CHANGELOG.tmp || { echo "No CHANGELOG entry found for $TAG"; exit 1; }
          mv CHANGELOG.tmp CHANGELOG
      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -w 0 -n {package-name}-v{project-version}
